name: Vigor Life integrity checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/whole-life-habit-coach-2026]
permissions:
  contents: read
jobs:
  logic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check adaptive-coach.js
          node --check growth-dashboard.js
          node --check premium-navigation.js
          node --check daily-focus.js
          node --check onboarding-guide.js
          node --check rotation-recap.js
          node --check premium-screens.js
          node --check sync-health.js
          node --check firebase-sync.js
          node --check couples-sync.js
      - name: Test coaching and habit journey
        run: node tests/adaptive-coach.test.cjs
      - name: Test daily habit focus
        run: node tests/daily-focus.test.cjs
      - name: Test saving and cloud-state accuracy
        run: node tests/sync-health.test.cjs
      - name: Test onboarding and completed rotation review
        run: node tests/onboarding-rotation.test.cjs
      - name: Test personal growth dashboard
        run: node tests/growth-dashboard.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Mobile and desktop UI smoke test
        run: node tests/ui-smoke.test.cjs
      - name: Verify interface assets
        run: |
          test -s modern-theme.css
          test -s premium-screens.css
          test -s theme-bridge.css
          test -s vigor-mark.svg
          test -s vigor-sunrise.svg
          grep -q 'premium-navigation.js' index.html
          grep -q 'daily-focus.js' index.html
          grep -q 'onboarding-guide.js' index.html
          grep -q 'rotation-recap.js' index.html
          grep -q 'premium-screens.js' index.html
          grep -q 'sync-health.js' index.html
          grep -q 'premium-screens.css' index.html
          grep -q 'theme-bridge.css' index.html
          grep -q 'adaptive-coach.js' index.html
          grep -q 'growth-dashboard.js' index.html
